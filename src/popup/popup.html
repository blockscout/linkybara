<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blockscout Link Replacer</title>
  <style>
    body {
      width: 320px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f5f5f5;
      font-size: 13px;
    }
    button:hover {
      background: #eee;
    }
    button.primary {
      background: #1976d2;
      color: white;
      border-color: #1976d2;
    }
    button.primary:hover {
      background: #1565c0;
    }
    #status {
      color: #666;
      font-size: 13px;
    }
    .disabled-list {
      margin-top: 12px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    .disabled-list h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .disabled-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
      color: #333;
    }
    .disabled-item button {
      padding: 4px 8px;
      font-size: 11px;
    }
    .empty-msg {
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>Blockscout Link Replacer</h2>
  <div class="row">
    <button id="toggle-site" class="primary">Disable on this site</button>
    <span id="status"></span>
  </div>
  <div class="disabled-list">
    <h3>Disabled sites</h3>
    <div id="disabled-sites-list"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
